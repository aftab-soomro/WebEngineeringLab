<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Aftab Soomro</title>
  <meta name="description" content="Contact form for Aftab Soomro, Web Engineering (Lab).">
</head>
<body>

  <header>
    <h1>Contact</h1>
    <p>Send me a message and I will reply as soon as I can.</p>
    <nav aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Message me</h2>

    <form action="#" method="post">
      <fieldset>
        <legend>Your details</legend>

        <p>
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </p>

        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </p>

        <p>
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel">
        </p>
      </fieldset>

      <fieldset>
        <legend>Your message</legend>

        <p>
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="course">A question about the course</option>
            <option value="project">Working together on a project</option>
            <option value="feedback">Feedback on this site</option>
            <option value="other">Something else</option>
          </select>
        </p>

        <p>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" cols="40" required></textarea>
        </p>

        <p>
          <input type="checkbox" id="copy" name="copy" value="yes">
          <label for="copy">Send me a copy of this message</label>
        </p>
      </fieldset>

      <p>
        <button type="submit">Send message</button>
        <button type="reset">Clear the form</button>
      </p>
    </form>

    <section>
      <h2>Other ways to reach me</h2>
      <address>
        <ul>
          <li>Email: <a href="mailto:me@example.com">me@example.com</a></li>
          <li>Phone: <a href="tel:+923001234567">+92 300 1234567</a></li>
        </ul>
      </address>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Aftab Soomro. All rights reserved.</p>
  </footer>

</body>
</html>
